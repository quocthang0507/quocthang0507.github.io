<div class="row">
    <div class="col-12 mb-4">
        <div class="card tool-guide-card">
            <div class="card-header bg-warning text-dark">
                <h6 class="mb-0">
                    <i class="fas fa-lightbulb"></i>
                    <span data-i18n="tool_guide.heading">Mẹo sử dụng &amp; Thông tin nhanh</span>
                </h6>
            </div>
            <div class="card-body">
                <div class="alert alert-info mb-3 d-flex align-items-start gap-2">
                    <i class="fas fa-info-circle mt-1 flex-shrink-0" aria-hidden="true"></i>
                    <div>
                        <strong data-i18n="tool_guide.quick_info_label">Thông tin nhanh:</strong>
                        <span data-i18n="guide.{{ include.tool }}.info">{{ include.info }}</span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <ul class="list-unstyled mb-0">
                            <li class="mb-2"><i class="fas fa-check text-success me-1" aria-hidden="true"></i> <span data-i18n="guide.{{ include.tool }}.tip1">{{ include.tip1 }}</span></li>
                            <li class="mb-2"><i class="fas fa-check text-success me-1" aria-hidden="true"></i> <span data-i18n="guide.{{ include.tool }}.tip2">{{ include.tip2 }}</span></li>
                        </ul>
                    </div>
                    <div class="col-md-6">
                        <ul class="list-unstyled mb-0">
                            <li class="mb-2"><i class="fas fa-check text-success me-1" aria-hidden="true"></i> <span data-i18n="guide.{{ include.tool }}.tip3">{{ include.tip3 }}</span></li>
                            <li class="mb-2"><i class="fas fa-check text-success me-1" aria-hidden="true"></i> <span data-i18n="guide.{{ include.tool }}.tip4">{{ include.tip4 }}</span></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
